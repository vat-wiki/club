  # 「卸载容器」冲突，故整体注释保留；恢复时去掉下列行首 `#` 即可。
  #
  # # 用「刚刚 publish 的 club-serve npm 包」构建镜像并推到 staging。needs: publish
  # # 保证 club-serve@$VER 已上 registry，镜像里 `npm install -g` 才不会 404
