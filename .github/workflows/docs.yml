# 构建 VitePress 文档站并发布到 GitHub Pages。
#
# 部署地址: https://vat-wiki.github.io/club/   (VitePress base = /club/)
#
# 首次使用前(一次性,手动):仓库 Settings → Pages → Build and deployment →
# Source 选 "GitHub Actions"。选完本 workflow 的 deploy job 即可写入 Pages。
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # deploy-pages 需要 OIDC 签发 id-token

# 同一时刻只跑一个 Pages 部署;新的不取消已在跑的(避免半成品上线)。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build docs (VitePress)
        run: npm run docs:build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
