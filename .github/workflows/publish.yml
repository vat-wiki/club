name: Publish

on:
  push:
    branches: [main]

permissions:
  id-token: write      # npm publish --provenance
  contents: read       # actions/checkout (both jobs)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build in dependency order. web is built BEFORE server so server's
      # copy-web-dist (also re-run by prepack during publish) can bundle the
      # SPA into the published tarball.
      - name: Build all packages
        run: |
          npm -w @club/shared run build
          npm -w @club/sdk     run build
          npm -w @club/web     run build
          npm -w club-serve  run build
          npm -w club-cli      run build

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          rm -f ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc

      # Publish. @club/shared is NOT published separately — it is inlined
      # into club-serve's dist/index.js by tsup (noExternal: @club/*), so `npx club-serve` needs
      # only the one package. Each step is version-idempotent (skips if the
      # version already exists on the registry); first publish: `npm view` 404s
      # → falls back to 0.0.0 → 0.1.0 ≠ 0.0.0 → publishes.

      - name: Publish club-serve (bundles SPA)
        run: |
          test -d packages/web/dist || { echo "✗ web dist missing — refusing to publish server without UI"; exit 1; }
          cd packages/server
          npm run copy-web-dist        # bundle packages/web/dist → dist/public/spa
          test -d dist/public/spa || { echo "✗ SPA copy failed"; exit 1; }
          L=$(node -p "require('./package.json').version")
          R=$(npm view club-serve version 2>/dev/null || echo "0.0.0")
          if [ "$L" = "$R" ]; then echo "⚠ club-serve $L already published, skipping"; exit 0; fi
          echo "✓ Publishing club-serve $L"
          npm publish --access public --provenance

      - name: Publish club-cli
        run: |
          cd packages/cli
          L=$(node -p "require('./package.json').version")
          R=$(npm view club-cli version 2>/dev/null || echo "0.0.0")
          if [ "$L" = "$R" ]; then echo "⚠ club-cli $L already published, skipping"; exit 0; fi
          echo "✓ Publishing club-cli $L"
          npm publish --access public --provenance

  # ── 已禁用（2026-08-03）：docker staging 双容器部署（prod :6500 / test :6600）
  # 退役，改走 npm 自托管单包 `npx club-serve`（见 CLAUDE.md / club-deployment）。
