# club — prod + test(staging) 双环境：一台机器、两个容器、按端口区分（内网，无 TLS）。
#
# 镜像版本管理（npm semver）：每个 service 从 .env 读取自己要跑的版本（package.json 的 version），
# prod 和 test 可以各 pin 各的——test 跑新版验证时 prod 仍停在旧版，验证 OK 再 promote。
# 旧版本镜像不会被覆盖，回滚就是改 .env 里 PROD_TAG 再 up。
#
# 日常流程（用脚本，别手改）：
#   ./scripts/version.sh patch                   # 先 bump 版本（自动 commit + 打 git tag v0.x.y）
#   ./scripts/deploy.sh build           # 建 club:<版本> → 写 TEST_TAG → 重启 test(:6600)
#   ./scripts/deploy.sh promote         # 把 test 验证通过的版本推广到 prod(:6500)
#   ./scripts/deploy.sh rollback <版本> # prod 回滚到指定版本
# 也可手动：docker build -t club:<版本> -t club:latest . 后改 .env 再 docker compose up -d <service>
#
# 注意：挂整个 /data 目录而非单个 club.db —— WAL 模式会生成 club.db-wal /
# club.db-shm，单文件挂载会丢掉它们、重启后丢数据。
services:
  club:                    # 生产  (host :6500)
    image: club:${CLUB_PROD_TAG:?CLUB_PROD_TAG 必须在 .env 里设置}
    ports:
      - "6500:6200"
    environment:
      CLUB_DB: /data/club.db
      CLUB_FILES: /data/files
      # TRUSTED_PROXY=true：让限流按 X-Forwarded-For 里的真实客户端 IP 分桶，而不是把
      # 所有请求归到反代/网关的同一个 IP 桶——那样 15/min 写限额会全站共享，多人并发
      # 发消息频繁 429（见 server rate-limit 的 clientIpKey）。仅当 club 位于会覆写
      # X-Forwarded-For 的可信反向代理（nginx/caddy，通常也负责 HTTPS）之后时才开启；
      # 否则攻击者可伪造该头绕过 per-IP 限流。裸 Docker 端口映射不产生 XFF，开启无效。
      TRUSTED_PROXY: "true"
      # ALLOWED_ORIGINS：生产环境若前端与 API 不同源，必须显式配置允许跨域的源
      # （逗号分隔，如 https://club.example.com）。留空时生产默认拒绝所有跨域请求
      # （见 server index.ts 的 CORS 逻辑），保证任意第三方网站无法跨域调用 API。
      # 同源部署（SPA 与 API 共用 club:6500）则无需设置。
      # ALLOWED_ORIGINS: "https://club.example.com"
    volumes:
      - club-data-prod:/data
    networks:
      dev-lan:
        ipv4_address: 10.88.0.21   # 生产，内网固定 IP
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:6200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  club-test:               # 预发布 / staging (host :6600)
    image: club:${CLUB_TEST_TAG:?CLUB_TEST_TAG 必须在 .env 里设置}
    ports:
      - "6600:6200"
    environment:
      CLUB_DB: /data/club.db
      CLUB_FILES: /data/files
      # TRUSTED_PROXY=true：让限流按 X-Forwarded-For 里的真实客户端 IP 分桶，而不是把
      # 所有请求归到反代/网关的同一个 IP 桶——那样 15/min 写限额会全站共享，多人并发
      # 发消息频繁 429（见 server rate-limit 的 clientIpKey）。仅当 club 位于会覆写
      # X-Forwarded-For 的可信反向代理（nginx/caddy，通常也负责 HTTPS）之后时才开启；
      # 否则攻击者可伪造该头绕过 per-IP 限流。裸 Docker 端口映射不产生 XFF，开启无效。
      TRUSTED_PROXY: "true"
      # ALLOWED_ORIGINS：同 prod，若 staging 前端与 API 不同源需显式配置。
      # 留空时生产默认拒绝跨域（见 server index.ts 的 CORS 逻辑）。
      # ALLOWED_ORIGINS: "https://staging.club.example.com"
    volumes:
      - club-data-test:/data
    networks:
      dev-lan:
        ipv4_address: 10.88.0.22   # 预发布，内网固定 IP
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:6200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  club-data-prod:
  club-data-test:

networks:
  dev-lan:                       # 共享内网（与 ~/projects/dener 的 dev 容器同网段；外部已建好）
    name: dev-lan
    external: true
